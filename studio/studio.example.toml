# Explainer Studio settings. Copy to studio.toml (next to this file) and fill in.
# Relative paths are relative to this studio folder. Use forward slashes, also on Windows.

[paths]
project = "D:/MyChannel"        # synced folder (Drive / Dropbox / OneDrive): CHANNEL.md, brand/, episodes/
models = "models"               # Whisper model lives here (about 3 GB, not synced)
render = "render"               # Manim render cache (safe to delete)
ffmpeg_bin = ""                 # folder containing ffmpeg; empty = use ffmpeg from PATH
backup = ""                     # where backup_code.py copies the studio code; empty = <project>/studio-code-backup
videos_json = ""                # optional: JSON list of published videos {"videos": [{date, series, title}]} for dedup
blog_images = ""                # optional: where extras/make_blog_figures.py writes figures

[channel]
name = "My Channel"             # shown in the intro, end card, IG cover
short_name = "MC"               # used when there is no logo file (watermark / seal fallback)
tagline = "Science, explained slowly"
website = "example.com"         # shown on the end card; empty = hidden
presenter = "Your Name"         # name tag line 1
presenter_title = "What you do, honestly"   # name tag line 2 (never a professional title you do not hold)
subscribe_label = "Subscribe"
next_label = ""                 # optional second label next to NEXT EPISODE on the end card, e.g. "下一期"
intro_title = "My Channel"      # big line under the logo in the intro sting
short_cta = "Full video on YouTube: search \"My Channel\""   # bottom line of the 9:16 short
logo_watermark = "brand/logo/watermark.png"   # relative to the project; optional (falls back to short_name)
logo_seal = "brand/logo/seal.png"             # round badge for intro / end card; optional

[language]
narration = "zh"                # Whisper language code of the narration (zh, en, ms, ja, ...)
whisper_prompt_prefix = "以下是普通话的句子。"   # helps Whisper with punctuation / script; "" for none
subtitle_main = "zh"            # burned-in subtitle language (the narration)
subtitle_second = "en"          # second SRT track (translation); "" = none
length_unit = "cjk"             # "cjk": count Chinese/Japanese characters; "words": count words
pace = 3.9                      # units per second, measured on your own voice (see check_script.py)
max_cue = 20                    # units per subtitle cue before it should be split
british_spelling = true         # check_script.py flags American spellings
term_list = ""                  # optional TOML of local-language term -> English term (see examples/)
new_idea_words = ["可是", "但是", "然而", "有趣的是", "那", "我们", "还有一点", "反过来"]   # longer pause before these

[palette]                        # channel colours (intro, end card, name tag, subtitles). Episodes pick their own.
accent = "#F2B90D"
accent_hi = "#FFD95C"
accent_deep = "#8A6400"
accent2 = "#00C8D2"
bg = "#1A160C"
bg_deep = "#131008"
card = "#231E10"
line = "#493F22"
text = "#F5F1E8"
muted = "#CBBC90"

[fonts]                          # family names as installed in the OS
title = "Noto Serif SC"
body = "Noto Sans SC"
label = "Space Grotesk"         # Latin only: use mixed() for labels with CJK
tagline = "Playfair Display"
body_latin = "Manrope"
subtitle = "Noto Sans SC Medium"
subtitle_heavy = "Noto Sans SC Black"
subtitle_files = ["NotoSansSC-Medium.ttf", "NotoSansSC-Black.ttf"]   # in <project>/brand/fonts/static, for ffmpeg

[video]
# encoder for the 1080p master. libx264 works everywhere; hardware options are faster:
#   Intel: ["-c:v", "h264_qsv", "-global_quality", "20", "-preset", "slow"]
#   NVIDIA: ["-c:v", "h264_nvenc", "-cq", "20", "-preset", "p6"]
#   Apple: ["-c:v", "h264_videotoolbox", "-q:v", "65"]
final_encoder = ["-c:v", "libx264", "-preset", "slow", "-crf", "18"]
fps = 30

[whisper]
model = "models/faster-whisper-large-v3"
device = "cpu"                  # "cuda" with an NVIDIA GPU
compute_type = "int8"           # "float16" on GPU

[music]
fluidsynth = "tools/fluidsynth/bin/fluidsynth.exe"   # or just "fluidsynth" when it is on PATH
soundfont = "soundfonts/GeneralUser-GS.sf2"
vsco_samples = "samples/VSCO-2-CE"                   # optional, only for gs_sampler.py
